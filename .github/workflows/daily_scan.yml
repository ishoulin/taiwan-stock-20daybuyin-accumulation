name: Taiwan Stock Chip Scanner

on:
  schedule:
    # 台灣時間週二至週六 凌晨 02:30 執行 (UTC 18:30)
    - cron: '30 18 * * 1-5'
  workflow_dispatch: # 手動觸發按鈕

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4  # 👈 已升級至 v4 (支援最新 Node.js)

      - name: Set up Python
        uses: actions/setup-python@v5  # 👈 已升級至 v5 (支援最新 Node.js)
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |    
          python -m pip install --upgrade pip
          pip install yfinance pandas twstock  # 👈 確保加入 twstock

      - name: Run Chip Scanner
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python taiwan_chip_scanner.py
